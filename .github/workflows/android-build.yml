name: Android Build

# Builds an installable release APK on the free GitHub-hosted runner (no paid
# EAS Build minutes). Runs on every push/merge to main, and can be triggered
# manually. android/ is gitignored (managed workflow) so it is regenerated with
# `expo prebuild`; the release build is signed with the template debug keystore,
# so no signing secrets are required.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel an in-progress build if a newer commit lands on the same ref.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    # Safety net: a misconfigured/runaway native build won't burn hours of minutes.
    timeout-minutes: 60
    # Mapped from secrets so the Telegram step can be skipped when unset.
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Limit to arm64-v8a only. RN 0.83 + New Architecture compiles native C++
      # from source; building all four ABIs on a 2-core runner takes ~1h+. A
      # single modern ABI covers virtually all real devices and cuts that ~4x.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spendwise-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # Upload the APK to litterbox (free temporary host, no account needed).
      # time=72h is the maximum retention litterbox offers.
      - name: Upload APK to litterbox
        id: litterbox
        working-directory: android/app/build/outputs/apk/release
        run: |
          APK=$(ls *.apk | head -n1)
          echo "Uploading $APK to litterbox..."
          URL=$(curl -fsS \
            -F "reqtype=fileupload" \
            -F "time=72h" \
            -F "fileToUpload=@${APK}" \
            https://litterbox.catbox.moe/resources/internals/api.php)
          case "$URL" in
            https://*)
              echo "Litterbox URL: $URL"
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "📦 **APK (expires in 72h):** $URL" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "Litterbox upload failed: $URL"
              exit 1
              ;;
          esac

      # Sends the download link to Telegram. Skipped if the secrets are not set,
      # so the build still succeeds before you finish the one-time bot setup.
      - name: Notify via Telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        env:
          LITTERBOX_URL: ${{ steps.litterbox.outputs.url }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          MSG=$(printf '✅ SpendWise Android build ready\n\nBranch: %s\nCommit: %s\n\n📦 %s\n\n(link expires in 72h)' \
            "$BRANCH" "${COMMIT:0:7}" "$LITTERBOX_URL")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data "disable_web_page_preview=true" > /dev/null
          echo "Telegram notification sent."
