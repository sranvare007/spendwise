name: Android Build

# Builds an installable release APK on the free GitHub-hosted runner (no paid
# EAS Build minutes). Runs on every push/merge to main, and can be triggered
# manually. android/ is gitignored (managed workflow) so it is regenerated with
# `expo prebuild`; the release build is signed with the template debug keystore,
# so no signing secrets are required.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel an in-progress build if a newer commit lands on the same ref.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    # Safety net: a misconfigured/runaway native build won't burn hours of minutes.
    timeout-minutes: 60
    # Mapped from secrets so the Telegram step can be skipped when unset.
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # The prebuild template configures only 2 GB heap / 512 MB metaspace, which
      # starves Gradle on the runner. Appended keys win over the generated ones.
      - name: Raise Gradle memory limits
        run: |
          {
            echo ""
            echo "# CI override (appended; last value wins)"
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          } >> android/gradle.properties

      # Limit to arm64-v8a only. RN 0.83 + New Architecture compiles native C++
      # from source; building all four ABIs on a 2-core runner is ~4x the work.
      # Skip the release Lint check (lintVitalRelease): it is build-blocking
      # overhead for a test APK and was hanging the job.
      - name: Build release APK
        working-directory: android
        run: >-
          ./gradlew assembleRelease --no-daemon
          -PreactNativeArchitectures=arm64-v8a
          -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spendwise-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # Upload the APK to litterbox (free temporary host, no account needed).
      # time=72h is the maximum retention litterbox offers.
      # Best-effort only: litterbox is an unreliable free service (frequent 5xx),
      # so this never fails the build — the APK is always available as the
      # GitHub Actions artifact uploaded above. Transient errors are retried.
      - name: Upload APK to litterbox
        id: litterbox
        continue-on-error: true
        working-directory: android/app/build/outputs/apk/release
        run: |
          APK=$(ls *.apk | head -n1)
          echo "Uploading $APK to litterbox..."
          URL=$(curl -sS --fail \
            --retry 5 --retry-all-errors --retry-delay 10 --max-time 300 \
            -F "reqtype=fileupload" \
            -F "time=72h" \
            -F "fileToUpload=@${APK}" \
            https://litterbox.catbox.moe/resources/internals/api.php) || URL=""
          case "$URL" in
            https://*)
              echo "Litterbox URL: $URL"
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "📦 **APK (expires in 72h):** $URL" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::warning::Litterbox upload failed/unavailable — download the APK from this run's Artifacts."
              echo "📦 Litterbox unavailable — download the APK from this run's **Artifacts**." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      # Sends the download link to Telegram. Skipped if the secrets are not set,
      # so the build still succeeds before you finish the one-time bot setup.
      # Non-fatal: a notification failure must not fail an otherwise-good build —
      # the APK is always on litterbox and in the run summary.
      - name: Notify via Telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        continue-on-error: true
        env:
          LITTERBOX_URL: ${{ steps.litterbox.outputs.url }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$LITTERBOX_URL" ]; then
            LINK=$(printf '📦 %s\n\n(link expires in 72h)' "$LITTERBOX_URL")
          else
            LINK=$(printf '📦 APK in the run Artifacts (login required):\n%s' "$RUN_URL")
          fi
          MSG=$(printf '✅ SpendWise Android build ready\n\nBranch: %s\nCommit: %s\n\n%s' \
            "$BRANCH" "${COMMIT:0:7}" "$LINK")
          HTTP=$(curl -sS -o /tmp/tg.json -w '%{http_code}' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data "disable_web_page_preview=true")
          echo "Telegram HTTP $HTTP"
          cat /tmp/tg.json; echo
          if [ "$HTTP" = "200" ]; then
            echo "Telegram notification sent."
          else
            echo "::warning::Telegram notification failed (HTTP $HTTP). APK: $LITTERBOX_URL"
          fi
